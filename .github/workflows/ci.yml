name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # The WING data is not redistributable, so the data-dependent tests
      # skip in CI. They are the bulk of the suite; run them locally.
      - run: python -m pytest tests/ -q
