[project]
name = "wingtbl"
version = "0.1.0"
description = "History-aware, interpretable modelling of wing turbulent boundary layers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "xarray>=2023.1", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
model = ["torch>=2.0", "scikit-learn>=1.3", "shap>=0.44", "pysr>=0.18"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wingtbl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
